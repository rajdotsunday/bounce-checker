
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>Bank Statement Bounce Checker</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;max-width:750px;margin:auto;
 font-family:Arial,sans-serif;background:#f5f3ff;color:#252238
}
header{
 background:linear-gradient(135deg,#6d28d9,#a855f7);
 color:white;padding:22px;border-radius:16px
}
h1{font-size:22px;margin:0 0 7px}
.panel{
 background:white;padding:18px;margin-top:15px;
 border-radius:15px;box-shadow:0 3px 15px #0000000d
}
label{display:block;font-weight:bold;margin:12px 0 7px}
input{
 width:100%;padding:13px;border:1px solid #ccc;
 border-radius:10px;font-size:15px
}
button{
 width:100%;padding:15px;margin-top:16px;
 background:#6d28d9;color:white;border:0;
 border-radius:10px;font-size:16px;font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.5}
#downloadPdf{
 background:#15803d;
 display:none;
}
#status{margin-top:12px;font-size:14px}
#results{display:none}
.item{
 border:1px solid #e5ddf5;padding:13px;
 border-radius:10px;margin:10px 0;overflow-wrap:anywhere
}
.item strong{color:#6d28d9}
.page{font-size:13px;color:#777;margin:5px 0}
.count{margin:7px 0;font-size:14px}
.note{font-size:12px;color:#777;line-height:1.5}
</style>
</head>

<body>

<header>
<h1>Bank Statement Bounce Checker</h1>
<div>Mobile & PC PDF Checking Tool</div>
</header>

<div class="panel">

<label>Bank Statement PDF Select Karein</label>
<input type="file" id="pdf" accept=".pdf,application/pdf">

<label>PDF Password</label>
<input type="password" id="password"
placeholder="PDF password enter karein (agar laga ho)">

<button id="run">CHECK STATEMENT</button>

<div id="status"></div>

<div id="refreshTimer"
style="display:none;color:#6d28d9;font-weight:bold;margin-top:12px">
Page automatically refresh hoga:
<span id="timer">60</span> seconds
</div>

</div>

<div class="panel" id="results">

<button id="downloadPdf">⬇ DOWNLOAD PDF REPORT</button>

<h3 id="summary"></h3>
<div id="counts"></div>
<div id="entries"></div>

<p class="note">
Keyword-based checking hai. Final loan verification ke liye
original bank statement se transaction confirm karein.
</p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PDF DOWNLOAD LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>

const $ = id => document.getElementById(id);

let finalResults = [];
let totalPages = 0;
let sourceFileName = "";

/* PDF.JS SETTINGS */

if(window.pdfjsLib){
 pdfjsLib.GlobalWorkerOptions.workerSrc =
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}


/* CHECKING KEYWORDS */

const patterns = {

 "BOUNCE":[
  /\bbounce\b/i,
  /\bbounced\b/i,
  /\bbouncing\b/i
 ],

 "RETURN":[
  /\breturn\b/i,
  /\breturned\b/i,
  /\brtn\b/i,
  /\bret\b/i
 ],

 "RETURN CHARGES":[
  /return\s*charges?/i,
  /return\s*chrg/i,
  /return\s*chg/i
 ],

 "PENALTY":[
  /\bpenalty\b/i,
  /\bpenal\b/i,
  /penal\s*charges?/i,
  /late\s*payment\s*charges?/i
 ],

 "NACH RETURN":[
  /nach\s*return/i,
  /nach\s*ret/i,
  /nach.*failed/i,
  /nach.*failure/i
 ],

 "ECS RETURN":[
  /ecs\s*return/i,
  /\becs\b/i,
  /ecsrt[n]?\d*/i,
  /ecs\s*rtn/i,
  /ecs.*failed/i,
  /ecs.*failure/i
 ],

 "CHEQUE RETURN":[
  /cheque\s*return/i,
  /cheque\s*bounce/i,
  /chq\s*return/i,
  /chq\s*bounce/i
 ],

 "EMI BOUNCE":[
  /emi\s*bounce/i,
  /emi.*return/i,
  /loan.*bounce/i
 ]

};


/* SAFE HTML */

function escapeHtml(text){

 return String(text).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));

}


/* EXTRACT PDF LINES */

function extractLines(items){

 const rows=[];

 for(const item of items){

  if(!item.str || !item.str.trim() || !item.transform)
   continue;

  const x=item.transform[4];
  const y=item.transform[5];

  let row=rows.find(r=>Math.abs(r.y-y)<2.5);

  if(!row){
   row={y,items:[]};
   rows.push(row);
  }

  row.items.push({
   x,
   str:item.str.trim(),
   width:item.width || 0
  });

 }

 rows.sort((a,b)=>b.y-a.y);

 return rows.map(row=>{

  row.items.sort((a,b)=>a.x-b.x);

  let output="";
  let right=null;

  for(const item of row.items){

   if(output && right!==null && item.x-right>1.5){
    output+=" ";
   }

   output+=item.str;

   right=item.x+(item.width || item.str.length*2.5);

  }

  return output.replace(/\s+/g," ").trim();

 }).filter(Boolean);

}


/* JOIN TRANSACTION NARRATION LINES */

function buildTransactions(lines){

 const transactions=[];

 let current=null;
 let pending=[];

 const datePattern =
  /\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b/;

 const isHeader = line =>
  /^(date|particulars|narration|description|debit|credit|balance|transaction details|statement of account)\b/i.test(line.trim());

 for(const line of lines){

  if(isHeader(line)){
   continue;
  }

  if(datePattern.test(line)){

   if(current){
    transactions.push(current);
   }

   current={
    text:[...pending,line].join(" ").trim()
   };

   pending=[];

  }else{

   if(current){

    current.text += " " + line;

   }else{

    pending.push(line);

    // Avoid attaching too many page-header lines
    if(pending.length>2){
     pending.shift();
    }

   }

  }

 }

 if(current){
  transactions.push(current);
 }

 // If no date-based rows are found, retain original lines
 if(!transactions.length){

  return lines.map(line=>({text:line}));

 }

 return transactions;

}


/* OPEN PDF WITH PASSWORD */

async function openPDF(data,password){

 return await pdfjsLib.getDocument({
  data:data.slice(),
  password:password || undefined
 }).promise;

}


/* AUTO REFRESH */

function startAutoRefresh(){

 let seconds=60;

 const box=document.getElementById("refreshTimer");
 const timer=document.getElementById("timer");

 box.style.display="block";
 timer.textContent=seconds;

 const countdown=setInterval(()=>{

  seconds--;
  timer.textContent=seconds;

  if(seconds<=0){
   clearInterval(countdown);
   location.reload();
  }

 },1000);

}


/* DOWNLOAD PDF REPORT */

$("downloadPdf").addEventListener("click",()=>{

 if(!finalResults.length){
  alert("Download ke liye koi report available nahi hai.");
  return;
 }

 if(!window.jspdf || !window.jspdf.jsPDF){
  alert("PDF download library load nahi hui. Internet check karein.");
  return;
 }

 try{

  const {jsPDF}=window.jspdf;

  const doc=new jsPDF({
   orientation:"landscape",
   unit:"mm",
   format:"a4"
  });

  doc.setFont("helvetica","bold");
  doc.setFontSize(17);

  doc.text("BANK STATEMENT BOUNCE CHECK REPORT",14,16);

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);

  doc.text("Source File: "+sourceFileName,14,24);
  doc.text("Total Pages: "+totalPages,14,30);
  doc.text("Matching Transactions: "+finalResults.length,14,36);

  const tableRows=finalResults.map((item,index)=>{

   const dateMatch=item.text.match(
    /\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b/
   );

   return [
    index+1,
    dateMatch ? dateMatch[0] : "-",
    item.categories.join(", "),
    item.text,
    item.page
   ];

  });

  doc.autoTable({

   startY:43,

   head:[[
    "S.No.",
    "Date",
    "Category",
    "Narration / Transaction Details",
    "Page"
   ]],

   body:tableRows,

   theme:"grid",

   styles:{
    font:"helvetica",
    fontSize:8,
    cellPadding:3,
    overflow:"linebreak",
    valign:"middle"
   },

   headStyles:{
    fillColor:[109,40,217],
    textColor:255
   },

   columnStyles:{
    0:{cellWidth:13},
    1:{cellWidth:23},
    2:{cellWidth:35},
    3:{cellWidth:"auto"},
    4:{cellWidth:15}
   },

   margin:{
    left:14,
    right:14
   }

  });

  const safeName=sourceFileName
   .replace(/\.pdf$/i,"")
   .replace(/[^a-z0-9_-]/gi,"_");

  doc.save("Bounce_Report_"+safeName+".pdf");

 }catch(error){

  alert("PDF download error: "+error.message);

 }

});


/* MAIN CHECKER */

$("run").addEventListener("click",async()=>{

 const file=$("pdf").files[0];

 $("results").style.display="none";
 $("downloadPdf").style.display="none";

 if(!file){
  $("status").textContent="Please select PDF first.";
  return;
 }

 if(!window.pdfjsLib){
  $("status").textContent="PDF reader load nahi hua. Internet check karein.";
  return;
 }

 $("run").disabled=true;
 $("status").textContent="Opening PDF...";

 try{

  const data=new Uint8Array(await file.arrayBuffer());

  let password=$("password").value;
  let pdf;

  /* PASSWORD PROTECTION */

  while(true){

   try{

    pdf=await openPDF(data,password);
    break;

   }catch(error){

    if(
     error.name==="PasswordException" ||
     error.code===1 ||
     error.code===2
    ){

     const entered=prompt(
      error.code===2
       ? "Wrong password. Enter correct password:"
       : "Enter bank statement PDF password:"
     );

     if(entered===null){
      throw new Error("Password entry cancelled.");
     }

     password=entered;
     $("password").value=entered;

    }else{
     throw error;
    }

   }

  }


  $("status").textContent="Checking statement...";

  const results=[];

  totalPages=pdf.numPages;
  sourceFileName=file.name;

  /* PAGE BY PAGE CHECKING */

  for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){

   $("status").textContent=
    `Checking page ${pageNo} / ${pdf.numPages}...`;

   const page=await pdf.getPage(pageNo);

   const actualPageNumber=page.pageNumber;

   const content=await page.getTextContent();

   const lines=extractLines(content.items);

   // Join narration lines with dated transaction lines
   const transactions=buildTransactions(lines);

   for(const transaction of transactions){

    const line=transaction.text;

    const matchedCategories=[];

    for(const [category,regexes] of Object.entries(patterns)){

     if(regexes.some(regex=>regex.test(line))){
      matchedCategories.push(category);
     }

    }

    if(matchedCategories.length){

     results.push({

      categories:matchedCategories,
      page:actualPageNumber,
      text:line

     });

    }

   }

  }


  /* CATEGORY COUNTS */

  const counts=Object.keys(patterns).map(category=>({

   category:category,

   total:results.filter(
    item=>item.categories.includes(category)
   ).length

  }));


  // Save final report for PDF download
  finalResults=results;


  $("summary").textContent=
   results.length
    ? `Total Matching Transactions: ${results.length}`
    : "No Matching Transactions Found";


  $("counts").innerHTML=counts.map(item=>`

   <div class="count">
    ${item.total ? "⚠️" : "✓"}
    <b>${item.category}</b>:
    ${item.total
      ? "FOUND ("+item.total+")"
      : "NOT FOUND"}
   </div>

  `).join("");


  /* SHOW MATCHING TRANSACTIONS */

  $("entries").innerHTML=results.length

   ? "<h3>Matching Transactions</h3>" +

     results.map((item,index)=>`

      <article class="item">

       <strong>
        ${index+1}. ${escapeHtml(item.categories.join(" / "))}
       </strong>

       <div class="page">
        Page Number: ${item.page}
       </div>

       <div>
        ${escapeHtml(item.text)}
       </div>

      </article>

     `).join("")

   : '<p style="color:green">No matching transactions found.</p>';


  $("results").style.display="block";

  if(results.length){
   $("downloadPdf").style.display="block";
  }

  $("status").textContent=
   `Checking Complete. Total Pages: ${pdf.numPages}`;

  startAutoRefresh();


 }catch(error){

  $("status").textContent=
   "Error: "+error.message;

 }finally{

  $("run").disabled=false;

 }

});

</script>

<script>
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
});
</script>

<script>
document.addEventListener("keydown", function(e) {

    if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.key.toUpperCase() === "U")
    ) {
        e.preventDefault();
        e.stopPropagation();
    }

});
</script>

</body>
</html>
